name: Build VSIX (per platform)

# Builds one VSIX per platform target and attaches them to a GitHub Release.
#
# Why per-platform: sharp ships its native binary as a set of platform-specific
# optionalDependencies (@img/sharp-<platform>). A VSIX built on one machine contains only
# that machine's binary, so a single "universal" VSIX only works on the OS it was built on.
# `vsce package --target` produces a VSIX that the Marketplace serves to the matching OS.
#
# Publishing is deliberately NOT automated — download the artifacts and publish manually.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SHARP_VERSION: 0.33.5

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            npm_os: win32
            cpu: x64
            img_pkg: win32-x64
          - target: darwin-x64
            npm_os: darwin
            cpu: x64
            img_pkg: darwin-x64
          - target: darwin-arm64
            npm_os: darwin
            cpu: arm64
            img_pkg: darwin-arm64
          - target: linux-x64
            npm_os: linux
            cpu: x64
            libc: glibc
            img_pkg: linux-x64
          - target: linux-arm64
            npm_os: linux
            cpu: arm64
            libc: glibc
            img_pkg: linux-arm64
          - target: alpine-x64
            npm_os: linux
            cpu: x64
            libc: musl
            img_pkg: linuxmusl-x64
          - target: alpine-arm64
            npm_os: linux
            cpu: arm64
            libc: musl
            img_pkg: linuxmusl-arm64

    name: package ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Host install first: esbuild and tsc must run on the runner's own platform.
      - name: Install (host)
        run: npm ci

      - name: Type check and bundle
        run: npm run package

      # Swap sharp's native binary for the target platform's. --no-save keeps
      # package.json/package-lock.json untouched; --force bypasses npm's EBADPLATFORM guard.
      - name: Install sharp for ${{ matrix.target }}
        run: |
          rm -rf node_modules/sharp node_modules/@img
          LIBC_FLAG=""
          if [ -n "${{ matrix.libc }}" ]; then LIBC_FLAG="--libc=${{ matrix.libc }}"; fi
          npm install --no-save --force \
            --os=${{ matrix.npm_os }} \
            --cpu=${{ matrix.cpu }} \
            $LIBC_FLAG \
            sharp@${SHARP_VERSION}

      # The guard. v0.0.4 shipped to every platform with only the win32-x64 binary inside;
      # this step makes that failure mode impossible to release silently.
      - name: Verify the correct native binary is present
        run: |
          echo "Contents of node_modules/@img:"
          ls -1 node_modules/@img/ || true
          if [ ! -d "node_modules/@img/sharp-${{ matrix.img_pkg }}" ]; then
            echo "::error::Expected node_modules/@img/sharp-${{ matrix.img_pkg }} for target ${{ matrix.target }}, but it is missing."
            exit 1
          fi
          for d in node_modules/@img/sharp-*; do
            name="$(basename "$d")"
            case "$name" in
              sharp-${{ matrix.img_pkg }}|sharp-libvips-*) ;;
              *) echo "::error::Unexpected foreign binary in bundle: $name"; exit 1 ;;
            esac
          done

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --target ${{ matrix.target }} --out "upfly-vscode-${{ matrix.target }}.vsix"

      - name: Confirm the VSIX is complete and carries only the target binary
        run: |
          contents="$(unzip -l "upfly-vscode-${{ matrix.target }}.vsix")"
          echo "Native binaries in the package:"
          echo "$contents" | grep -o 'extension/node_modules/@img/[^/]*' | sort -u

          # The bundle marks these as external, so they must ship as real files.
          # Without this check a missing dep builds fine and fails at runtime.
          for required in \
            "extension/dist/extension.js" \
            "extension/node_modules/sharp/package.json" \
            "extension/node_modules/file-type/package.json" \
            "extension/node_modules/jsonc-parser/package.json" \
            "extension/node_modules/@img/sharp-${{ matrix.img_pkg }}"; do
            if ! echo "$contents" | grep -q "$required"; then
              echo "::error::VSIX for ${{ matrix.target }} is missing $required"
              exit 1
            fi
          done
          echo "VSIX contents verified for ${{ matrix.target }}."

      - uses: actions/upload-artifact@v4
        with:
          name: upfly-vscode-${{ matrix.target }}
          path: upfly-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach VSIX files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          draft: true
          generate_release_notes: true
